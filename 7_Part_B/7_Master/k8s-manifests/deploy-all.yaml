kind: ConfigMap
metadata:
  name: service-c-code
  namespace: cni-benchmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c
  namespace: cni-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
    spec:
      containers:
      - command:
        - python
        - /app/app.py
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ACTIVE_CNI
          value: Flannel # REPLACE_CNI
        image: python:3.11-slim
        name: service-c
        ports:
        - containerPort: 5002
        volumeMounts:
        - mountPath: /app
          name: code
        - mountPath: /var/lib/cni-ledger
          name: persistent-data
      nodeSelector:
        kubernetes.io/hostname: worker-2
      volumes:
      - configMap:
          name: service-c-code
        name: code
      - hostPath:
          path: /var/lib/cni-benchmark-ledger
          type: DirectoryOrCreate
        name: persistent-data
