    \ }\n    .media-item { background: #111927; border: 1px solid var(--line); border-radius:\
    \ 10px; padding: 7px; }\n    .media-item img, .media-item video { width: 100%;\
    \ max-height: 120px; object-fit: cover; border-radius: 7px; background: #0d1420;\
    \ }\n    .media-meta { font-size: 11px; color: var(--muted); margin-top: 5px;\
    \ line-height: 1.35; }\n    .media-actions a { color: var(--accent); text-decoration:\
    \ none; margin-right: 8px; font-size: 11px; }\n  </style>\n  <script>\n    let\
    \ loadTimer = null;\n    let loadStartedAt = 0;\n    let loadDurationMs = 0;\n\
