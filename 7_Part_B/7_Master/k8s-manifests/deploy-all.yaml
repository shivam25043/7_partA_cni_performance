kind: ConfigMap
metadata:
  name: service-a-code
  namespace: cni-benchmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: cni-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - command:
        - python
        - /app/app.py
        env:
        - name: SERVICE_B_URL
          value: http://service-b.cni-benchmark.svc.cluster.local:5001
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: python:3.11-slim
        name: service-a
        ports:
        - containerPort: 5000
        volumeMounts:
        - mountPath: /app
          name: code
      nodeSelector:
        kubernetes.io/hostname: worker-1
      volumes:
      - configMap:
          name: service-a-code
        name: code
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: cni-benchmark
spec:
  ports:
  - nodePort: 30080
    port: 5000
    targetPort: 5000
  selector:
    app: service-a
  type: NodePort
