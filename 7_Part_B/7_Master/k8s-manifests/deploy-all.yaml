data:
  app.py: "import os, json, urllib.request, urllib.parse\nfrom http.server import\
    \ HTTPServer, BaseHTTPRequestHandler, ThreadingHTTPServer\n\nSERVICE_B = os.environ.get(\"\
    SERVICE_B_URL\", \"http://service-b.cni-benchmark.svc.cluster.local:5001\")\n\n\
    HTML_PAGE = \"\"\"\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Worker-1 CNI Test\
    \ Console</title>\n  <style>\n    :root {\n      --bg: #0f111a;\n      --panel:\
    \ #161b25;\n      --panel-2: #1f2735;\n      --line: #2f3b50;\n      --text: #e8edf4;\n\
    \      --muted: #9aa7b8;\n      --accent: #7aa2f7;\n    }\n    * { box-sizing:\
    \ border-box; }\n    body { margin: 0; font-family: 'Inter', 'Segoe UI', sans-serif;\
    \ background: linear-gradient(145deg, #0f111a, #141b2a); color: var(--text); }\n\
    \    .container { max-width: 1450px; margin: 0 auto; padding: 18px; }\n    .hero\
    \ { background: var(--panel); border: 1px solid var(--line); border-radius: 15px;\
    \ padding: 16px; margin-bottom: 12px; }\n    .hero h1 { margin: 0 0 6px; font-size:\
    \ 24px; }\n    .hero p { margin: 0; color: var(--muted); }\n    .badge { margin-top:\
    \ 10px; display: inline-block; font-size: 12px; border-radius: 999px; border:\
    \ 1px solid #374867; background: #1c2738; color: #c8d9fb; padding: 6px 10px; }\n\
    \    .layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; }\n\
    \    .card { background: var(--panel); border: 1px solid var(--line); border-radius:\
    \ 13px; padding: 12px; }\n    .card h3 { margin: 0 0 10px; font-size: 15px; color:\
    \ #d8e2f1; }\n    .chat-box { height: 440px; overflow-y: auto; overflow-x: hidden;\
    \ border: 1px solid var(--line); border-radius: 10px; background: #101624; padding:\
    \ 10px; }\n    .msg { background: linear-gradient(140deg, #1a2233, #222d40); border:\
    \ 1px solid #32425f; border-radius: 10px; margin-bottom: 8px; padding: 8px; max-width:\
    \ 100%; overflow-wrap: anywhere; word-break: break-word; }\n    .msg-text { display:\
    \ block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow:\
    \ ellipsis; color: #eef4ff; font-weight: 600; }\n    .meta { font-size: 11px;\
    \ color: #9fb0c8; margin-bottom: 4px; }\n    .mtr { font-size: 12px; color: #a9e7b9;\
    \ }\n    .row { display: flex; gap: 8px; margin-top: 10px; }\n    input[type=\"\
    text\"], input[type=\"number\"], select { width: 100%; border-radius: 9px; border:\
    \ 1px solid #3b4a66; background: #111a29; color: var(--text); padding: 9px; }\n\
    \    input[type=\"file\"] { width: 100%; border-radius: 9px; border: 1px solid\
    \ #3b4a66; background: #111a29; color: var(--text); padding: 8px; }\n    button\
    \ { border: none; border-radius: 9px; background: linear-gradient(145deg, #7aa2f7,\
    \ #8b9bff); color: #0e1420; font-weight: 700; padding: 9px 12px; cursor: pointer;\
    \ }\n    .btn-alt { background: linear-gradient(145deg, #8bd5a1, #9ad9c1); }\n\
    \    .btn-stop { background: linear-gradient(145deg, #f38ba8, #f5a97f); }\n  \
    \  button:disabled { opacity: 0.55; cursor: wait; }\n    .hint { font-size: 12px;\
    \ color: var(--muted); margin-top: 6px; line-height: 1.4; }\n    .stat-grid {\
    \ display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 8px;\
    \ margin-bottom: 10px; }\n    .stat { background: #121a29; border: 1px solid var(--line);\
    \ border-radius: 10px; padding: 9px; }\n    .stat .k { font-size: 11px; color:\
    \ var(--muted); }\n    .stat .v { font-size: 18px; font-weight: 700; color: #f2f6ff;\
    \ }\n    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px;\
    \ }\n    .control-grid .full { grid-column: 1 / span 2; }\n    .status-line {\
    \ margin-top: 8px; font-size: 12px; color: #c9d8ef; }\n    .preset { font-size:\
    \ 12px; color: #c2d2e9; border: 1px solid #3a4b67; background: #172234; padding:\
    \ 5px 8px; border-radius: 8px; cursor: pointer; }\n    .media-grid { display:\
