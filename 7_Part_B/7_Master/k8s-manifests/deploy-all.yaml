  app.py: "import os, time, json, urllib.parse, math\nfrom http.server import HTTPServer,\
    \ BaseHTTPRequestHandler, ThreadingHTTPServer\n\nDATABASE = []\nPERSISTENT_FILE\
    \ = \"/var/lib/cni-ledger/leaderboard.json\"\nFILE_INDEX = \"/var/lib/cni-ledger/files.json\"\
    \nUPLOAD_DIR = \"/var/lib/cni-ledger/uploads\"\n\nos.makedirs(UPLOAD_DIR, exist_ok=True)\n\
    \ndef load_leaderboard():\n  if os.path.exists(PERSISTENT_FILE):\n    try:\n \
    \     with open(PERSISTENT_FILE, \"r\") as f:\n        return json.load(f)\n \
    \   except:\n      pass\n  return {\"Flannel\": {}, \"Calico\": {}, \"Cilium\"\
    : {}}\n\ndef save_leaderboard(board):\n  try:\n    with open(PERSISTENT_FILE,\
    \ \"w\") as f:\n      json.dump(board, f)\n  except:\n    pass\n\ndef load_files():\n\
    \  if os.path.exists(FILE_INDEX):\n    try:\n      with open(FILE_INDEX, \"r\"\
    ) as f:\n        return json.load(f)\n    except:\n      pass\n  return []\n\n\
    def save_files(files):\n  try:\n    with open(FILE_INDEX, \"w\") as f:\n     \
    \ json.dump(files, f)\n  except:\n    pass\n\nFILES = load_files()\n\ndef next_message_id():\n\
    \  highest = 0\n  for row in DATABASE:\n    try:\n      highest = max(highest,\
    \ int(row.get(\"id\", 0) or 0))\n    except:\n      pass\n  return highest + 1\n\
    \ndef get_cpu_load():\n  try:\n    return round(os.getloadavg()[0], 2)\n  except:\n\
    \    return 0.0\n\ndef percentile(values, pct):\n  if not values:\n    return\
    \ 0.0\n  arr = sorted(values)\n  if len(arr) == 1:\n    return round(arr[0], 2)\n\
    \  idx = (len(arr) - 1) * pct\n  lo = int(math.floor(idx))\n  hi = int(math.ceil(idx))\n\
    \  if lo == hi:\n    return round(arr[lo], 2)\n  return round(arr[lo] + (arr[hi]\
    \ - arr[lo]) * (idx - lo), 2)\n\ndef stddev(values):\n  if not values:\n    return\
    \ 0.0\n  mean = sum(values) / len(values)\n  var = sum((v - mean) ** 2 for v in\
    \ values) / len(values)\n  return round(math.sqrt(var), 2)\n\ndef safe_name(name):\n\
    \  cleaned = os.path.basename(name or \"upload.bin\").strip()\n  return cleaned\
    \ if cleaned else \"upload.bin\"\n\ndef human_size(size_bytes):\n  size = float(size_bytes\
    \ or 0)\n  units = [\"B\", \"KB\", \"MB\", \"GB\"]\n  idx = 0\n  while size >=\
    \ 1024 and idx < len(units) - 1:\n    size /= 1024.0\n    idx += 1\n  return f\"\
    {size:.1f} {units[idx]}\"\n\ndef kind_from_type(content_type):\n  ctype = (content_type\
    \ or \"\").lower()\n  if ctype.startswith(\"image/\"):\n    return \"image\"\n\
    \  if ctype.startswith(\"video/\"):\n    return \"video\"\n  return \"file\"\n\
    \ndef auto_load_stats(records, now_ts):\n  recent_auto = [m for m in records if\
    \ now_ts - m.get(\"timestamp\", 0) <= 30 and str(m.get(\"text\", \"\")).startswith(\"\
    [AUTO|\")]\n  if not recent_auto:\n    return {\n      \"events_30s\": 0,\n  \
    \    \"rps_30s\": 0.0,\n      \"mode\": \"idle\",\n      \"session\": \"--\"\n\
    \    }\n\n  mode_count = {}\n  session_count = {}\n  for row in recent_auto:\n\
    \    text = str(row.get(\"text\", \"\"))\n    parts = text.split(\"|\")\n    if\
    \ len(parts) >= 4:\n      mode = parts[1]\n      sess = parts[2]\n      mode_count[mode]\
    \ = mode_count.get(mode, 0) + 1\n      session_count[sess] = session_count.get(sess,\
    \ 0) + 1\n\n  dominant_mode = max(mode_count.items(), key=lambda x: x[1])[0] if\
    \ mode_count else \"mixed\"\n  dominant_session = max(session_count.items(), key=lambda\
    \ x: x[1])[0] if session_count else \"--\"\n  return {\n    \"events_30s\": len(recent_auto),\n\
    \    \"rps_30s\": round(len(recent_auto) / 30.0, 2),\n    \"mode\": dominant_mode,\n\
    \    \"session\": dominant_session\n  }\n\ndef delete_file_record(file_id):\n\
    \  target = next((f for f in FILES if int(f.get(\"id\", 0)) == int(file_id)),\
    \ None)\n  if not target:\n    return False\n  try:\n    file_path = target.get(\"\
    path\", \"\")\n    if file_path and os.path.exists(file_path):\n      os.remove(file_path)\n\
    \  except:\n    pass\n  FILES[:] = [f for f in FILES if int(f.get(\"id\", 0))\
    \ != int(file_id)]\n  DATABASE[:] = [m for m in DATABASE if int(m.get(\"file_id\"\
    , -1) or -1) != int(file_id)]\n  save_files(FILES)\n  return True\n\ndef delete_message_record(message_id):\n\
    \  target = next((m for m in DATABASE if int(m.get(\"id\", 0)) == int(message_id)),\
    \ None)\n  if not target:\n    return False\n  if target.get(\"type\") == \"file\"\
    \ and target.get(\"file_id\") is not None:\n    return delete_file_record(int(target.get(\"\
    file_id\")))\n  DATABASE[:] = [m for m in DATABASE if int(m.get(\"id\", 0)) !=\
    \ int(message_id)]\n  return True\n\ndef clear_all_data():\n  for row in list(FILES):\n\
    \    try:\n      file_path = row.get(\"path\", \"\")\n      if file_path and os.path.exists(file_path):\n\
    \        os.remove(file_path)\n    except:\n      pass\n  FILES.clear()\n  DATABASE.clear()\n\
    \  save_files(FILES)\n  save_leaderboard({\"Flannel\": {}, \"Calico\": {}, \"\
    Cilium\": {}})\n\ndef health_grade(p95, jitter, data_rate):\n  if p95 <= 15 and\
    \ jitter <= 5 and data_rate >= 0.2:\n    return \"Excellent\"\n  if p95 <= 30\
    \ and jitter <= 10:\n    return \"Good\"\n  if p95 <= 60 and jitter <= 20:\n \
    \   return \"Fair\"\n  return \"Needs Tuning\"\n\ndef update_metrics_and_board():\n\
    \  now = time.time()\n  active_cni = os.environ.get(\"ACTIVE_CNI\", \"Flannel\"\
    )\n  recent_records = [m for m in DATABASE if now - m[\"timestamp\"] <= 5.0]\n\
    \  throughput = round(len(recent_records) / 5.0, 2) if DATABASE else 0.0\n  latencies\
    \ = [float(m.get(\"cni_latency_ms\", 0) or 0) for m in DATABASE]\n  avg_latency\
    \ = round(sum(latencies) / len(latencies), 2) if latencies else 0.0\n  p95 = percentile(latencies,\
    \ 0.95)\n  p99 = percentile(latencies, 0.99)\n  jitter = stddev(latencies)\n \
    \ bytes_recent = sum(int(m.get(\"payload_bytes\", 0) or 0) for m in recent_records)\n\
    \  data_rate_mbps = round((bytes_recent / 5.0) / (1024 * 1024), 3)\n  cpu = get_cpu_load()\n\
    \  grade = health_grade(p95, jitter, data_rate_mbps)\n  auto_stats = auto_load_stats(DATABASE,\
    \ now)\n\n  board = load_leaderboard()\n  if active_cni not in board:\n    board[active_cni]\
    \ = {}\n  record = board.get(active_cni, {})\n  record[\"max_throughput\"] = max(record.get(\"\
    max_throughput\", 0.0), throughput)\n  record[\"avg_latency\"] = avg_latency if\
    \ avg_latency > 0 else record.get(\"avg_latency\", 0.0)\n  record[\"max_cpu\"\
    ] = max(record.get(\"max_cpu\", 0.0), cpu)\n  record[\"best_p95\"] = p95 if record.get(\"\
    best_p95\") is None else min(record.get(\"best_p95\", p95), p95)\n  board[active_cni]\
    \ = record\n  save_leaderboard(board)\n\n  metrics = {\n    \"active_cni\": active_cni,\n\
    \    \"cpu_load_1m\": cpu,\n    \"avg_latency_ms\": avg_latency,\n    \"p95_latency_ms\"\
    : p95,\n    \"p99_latency_ms\": p99,\n    \"jitter_ms\": jitter,\n    \"throughput_rps\"\
    : throughput,\n    \"data_rate_mbps\": data_rate_mbps,\n    \"health_grade\":\
    \ grade,\n    \"auto_events_30s\": auto_stats[\"events_30s\"],\n    \"auto_rps_30s\"\
    : auto_stats[\"rps_30s\"],\n    \"auto_mode\": auto_stats[\"mode\"],\n    \"auto_session\"\
    : auto_stats[\"session\"],\n    \"total_records\": len(DATABASE),\n    \"total_files\"\
    : len(FILES)\n  }\n  return board, metrics\n\nHTML_DASHBOARD = \"\"\"\n<!DOCTYPE\
