apiVersion: v1
data:
  app.py: "import os, time, json, urllib.request, urllib.parse\nfrom http.server import\
    \ HTTPServer, BaseHTTPRequestHandler, ThreadingHTTPServer\n\nSERVICE_C_BASE =\
    \ os.environ.get(\"SERVICE_C_BASE\", \"http://service-c.cni-benchmark.svc.cluster.local:5002\"\
    )\nSERVICE_C_DATA = os.environ.get(\"SERVICE_C_URL\", f\"{SERVICE_C_BASE}/data\"\
    )\nSERVICE_C_UPLOAD = os.environ.get(\"SERVICE_C_UPLOAD\", f\"{SERVICE_C_BASE}/upload\"\
    )\n\nclass Handler(BaseHTTPRequestHandler):\n  def address_string(self):\n   \
    \ return self.client_address[0]\n  def _send_json(self, payload, status=200):\n\
    \    body = json.dumps(payload).encode()\n    self.send_response(status)\n   \
    \ self.send_header(\"Content-Type\", \"application/json\")\n    self.send_header(\"\
    Content-Length\", str(len(body)))\n    self.end_headers()\n    self.wfile.write(body)\n\
    \n  def do_GET(self):\n    if self.path == \"/health\":\n      self._send_json({\"\
    status\": \"healthy\", \"service\": \"service-b\"})\n      return\n\n    if self.path\
    \ == \"/history\":\n      try:\n        with urllib.request.urlopen(SERVICE_C_DATA,\
    \ timeout=20) as r:\n          payload = r.read()\n        self.send_response(200)\n\
    \        self.send_header(\"Content-Type\", \"application/json\")\n        self.send_header(\"\
    Content-Length\", str(len(payload)))\n        self.end_headers()\n        self.wfile.write(payload)\n\
    \      except Exception as e:\n        self._send_json({\"error\": str(e)}, 502)\n\
    \      return\n\n    if self.path.startswith(\"/download\") or self.path.startswith(\"\
    /media\"):\n      try:\n        query = urllib.parse.urlparse(self.path).query\n\
    \        file_id = urllib.parse.parse_qs(query).get(\"id\", [\"\"])[0]\n     \
    \   if not file_id:\n          self._send_json({\"error\": \"missing id\"}, 400)\n\
    \          return\n        target = f\"{SERVICE_C_BASE}/files/{file_id}\" if self.path.startswith(\"\
    /download\") else f\"{SERVICE_C_BASE}/media/{file_id}\"\n        with urllib.request.urlopen(target,\
    \ timeout=900) as r:\n          content_type = r.headers.get(\"Content-Type\"\
    , \"application/octet-stream\")\n          disposition = r.headers.get(\"Content-Disposition\"\
    )\n          content_length = r.headers.get(\"Content-Length\")\n\n          self.send_response(200)\n\
    \          self.send_header(\"Content-Type\", content_type)\n          if disposition:\n\
    \            self.send_header(\"Content-Disposition\", disposition)\n        \
    \  if content_length:\n            self.send_header(\"Content-Length\", content_length)\n\
    \          self.end_headers()\n          while True:\n            chunk = r.read(1024\
    \ * 1024)\n            if not chunk:\n              break\n            self.wfile.write(chunk)\n\
    \      except Exception as e:\n        self._send_json({\"error\": str(e)}, 502)\n\
    \      return\n\n    self._send_json({\"error\": \"unsupported route\"}, 404)\n\
    \n  def do_POST(self):\n    if self.path == \"/process\":\n      start = time.time()\n\
    \      content_length = int(self.headers.get(\"Content-Length\", \"0\"))\n   \
    \   post_data = self.rfile.read(content_length)\n\n      try:\n        payload\
    \ = json.loads(post_data or b\"{}\")\n        time.sleep(0.005)\n        hop_time_ms\
    \ = round((time.time() - start) * 1000, 2)\n\n        db_payload = {\n       \
    \   \"text\": payload.get(\"text\", \"\"),\n          \"sender_node\": payload.get(\"\
    node\", \"unknown\"),\n          \"latency_ms\": hop_time_ms\n        }\n    \
    \    req = urllib.request.Request(\n          SERVICE_C_DATA,\n          data=json.dumps(db_payload).encode(),\n\
    \          headers={\"Content-Type\": \"application/json\"}\n        )\n     \
    \   with urllib.request.urlopen(req, timeout=20) as r:\n          _ = r.read()\n\
    \n        final_ms = round((time.time() - start) * 1000, 2)\n        self._send_json({\"\
    status\": \"success\", \"total_processing\": final_ms, \"hop_latency\": hop_time_ms})\n\
    \      except Exception as e:\n        self._send_json({\"status\": \"error\"\
    , \"error\": str(e)}, 502)\n      return\n\n    if self.path == \"/upload\":\n\
    \      start = time.time()\n      content_length = int(self.headers.get(\"Content-Length\"\
    , \"0\"))\n      body = self.rfile.read(content_length)\n      sender = self.headers.get(\"\
    X-Sender-Node\", \"unknown\")\n      filename = self.headers.get(\"X-Filename\"\
    , \"upload.bin\")\n      content_type = self.headers.get(\"X-Content-Type\", \"\
    application/octet-stream\")\n\n      try:\n        time.sleep(0.005)\n       \
    \ hop_time_ms = round((time.time() - start) * 1000, 2)\n        req = urllib.request.Request(\n\
    \          SERVICE_C_UPLOAD,\n          data=body,\n          headers={\n    \
    \        \"Content-Type\": \"application/octet-stream\",\n            \"X-Filename\"\
    : filename,\n            \"X-Content-Type\": content_type,\n            \"X-Sender-Node\"\
    : sender,\n            \"X-Latency-Ms\": str(hop_time_ms)\n          }\n     \
    \   )\n        with urllib.request.urlopen(req, timeout=1200) as r:\n        \
    \  response = r.read()\n\n        self.send_response(200)\n        self.send_header(\"\
    Content-Type\", \"application/json\")\n        self.send_header(\"Content-Length\"\
    , str(len(response)))\n        self.end_headers()\n        self.wfile.write(response)\n\
    \      except Exception as e:\n        self._send_json({\"status\": \"error\"\
    , \"error\": str(e)}, 502)\n      return\n\n    self._send_json({\"error\": \"\
    unsupported route\"}, 404)\n\n  def log_message(self, fmt, *args):\n    pass\n\
    \nThreadingHTTPServer((\"0.0.0.0\", 5001), Handler).serve_forever()\n"
