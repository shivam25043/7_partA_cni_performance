###############################################################################
# Service B - API Deployment & Service
# Pinned to Worker-2 via nodeSelector
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: cni-benchmark
  labels:
    app: service-b
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
        tier: api
    spec:
      # Pin Service B to Worker-2
      nodeSelector:
        service-placement: service-b
      containers:
        - name: service-b
          image: cniproject/service-b:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: SERVICE_C_URL
              value: "http://service-c.cni-benchmark.svc.cluster.local:5002"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: cni-benchmark
  labels:
    app: service-b
spec:
  type: ClusterIP
  selector:
    app: service-b
  ports:
    - name: http
      protocol: TCP
      port: 5001
      targetPort: 5001
